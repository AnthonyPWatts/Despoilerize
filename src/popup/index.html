<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>DeSpoilerize</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="popup">
      <header class="popup-header">
        <h1 id="popup-title">DeSpoilerize</h1>
        <p id="status" class="status off">
          <span class="status-icon" aria-hidden="true"></span>
          <span id="status-text">Protection: OFF</span>
        </p>
      </header>

      <button id="toggle" class="primary" type="button">
        <span class="power-icon" aria-hidden="true"></span>
        <span>Start protection</span>
      </button>

      <section class="panel schedule-panel" aria-labelledby="schedule-title">
        <header class="panel-header">
          <span class="panel-icon purple" aria-hidden="true">Cal</span>
          <div>
            <h2 id="schedule-title">Protection schedule</h2>
            <p id="schedule-description">Every weekend</p>
          </div>
        </header>

        <div class="summary-row">
          <div>
            <span>Next protection:</span>
            <strong id="next-protection">Not scheduled</strong>
          </div>
          <div>
            <span>Ends:</span>
            <strong id="protection-ends">Not scheduled</strong>
          </div>
        </div>
      </section>

      <section class="panel setup-panel" aria-label="Current protection setup">
        <div>
          <span>Protecting</span>
          <strong id="enabled-packs-summary"></strong>
        </div>
        <div>
          <span>Sensitivity</span>
          <strong id="sensitivity-summary"></strong>
        </div>
      </section>

      <div class="action-grid">
        <button id="open-options" class="secondary" type="button">
          <span>Manage protection</span>
          <span aria-hidden="true">></span>
        </button>
        <button id="reveal-all" class="danger" type="button">
          <span>Reveal page</span>
        </button>
      </div>

      <p class="timezone-note">All times are based on your local time zone.</p>
    </main>
  </body>
</html>
