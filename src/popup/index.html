<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>DeSpoilerize</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main class="popup">
      <h1>DeSpoilerize</h1>

      <p id="status" class="status off">Catch-up Mode: OFF</p>

      <button id="toggle" class="primary" type="button">Turn on</button>

      <section>
        <h2>Protect until</h2>
        <div class="row">
          <button data-expiry-hours="2" type="button">2h</button>
          <button id="tonight" type="button">Tonight</button>
          <button data-expiry-hours="24" type="button">24h</button>
          <button id="manual" type="button">Manual</button>
        </div>
      </section>

      <section>
        <h2>Sensitivity</h2>
        <select id="sensitivity">
          <option value="gentle">Gentle</option>
          <option value="balanced">Balanced</option>
          <option value="lockdown">Lockdown</option>
        </select>
      </section>

      <section>
        <h2>Protecting</h2>
        <p id="enabled-packs-summary" class="pack-summary"></p>
        <button id="open-options" type="button">Change topics and settings</button>
      </section>

      <section>
        <button id="reveal-all" type="button">Reveal all on this page</button>
      </section>

      <p id="expiry" class="small"></p>
    </main>
  </body>
</html>
