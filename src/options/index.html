<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>DeSpoilerize Settings</title>
    <link rel="stylesheet" href="./styles.css" />
    <script type="module" src="./main.ts"></script>
  </head>
  <body>
    <main>
      <h1>DeSpoilerize Settings</h1>

      <section>
        <h2>Custom protected terms</h2>
        <p>Add one team, driver, event, or phrase per line.</p>
        <textarea id="custom-terms"></textarea>
      </section>

      <section>
        <h2>Trusted sites</h2>
        <p>
          DeSpoilerize will not hide anything on these domains. Add one domain per line,
          for example <code>example.com</code>.
        </p>
        <textarea id="trusted-sites"></textarea>
      </section>

      <button id="save" type="button">Save settings</button>
      <p id="saved-message" class="saved-message" aria-live="polite"></p>
    </main>
  </body>
</html>
